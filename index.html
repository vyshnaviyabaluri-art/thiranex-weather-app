<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard - Vyshnavi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🌤️ Weather Dashboard</h1>
  <p class="subtitle">Real-time Weather using REST API</p>
  <div class="search-box">
    <input type="text" id="cityInput" placeholder="Enter city" value="Vijayawada">
    <button id="searchBtn">Search</button>
  </div>
  <div id="loader" class="loader hidden">Loading...</div>
  <div id="error" class="error hidden"></div>
  <div id="weatherCard" class="weather-card hidden">
    <h2 id="cityName"></h2>
    <div class="temp" id="temp"></div>
    <p id="desc"></p>
    <div class="details">
      <div class="detail-item"><span>💧 Humidity</span><strong id="humidity"></strong></div>
      <div class="detail-item"><span>💨 Wind</span><strong id="wind"></strong></div>
      <div class="detail-item"><span>🌡️ Feels Like</span><strong id="feelsLike"></strong></div>
    </div>
    <p class="updated" id="updated"></p>
  </div>
  <footer>Built by Vyshnavi | Task 4</footer>
</div>
<script src="script.js"></script>
</body>
</html>
